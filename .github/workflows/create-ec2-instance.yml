name: Create EC2 Instance

on:
  workflow_dispatch:
    inputs:
      instance_name:      { description: 'Instance name',  required: true,  type: string }
      instance_type:      { description: 'Instance type',  required: true,  type: string }
      ami_id:             { description: 'AMI ID',         required: true,  type: string }
      region:             { description: 'AWS region',     required: true,  type: string }
      environment:        { description: 'Environment',    required: true,  type: string }
      owner:              { description: 'Owning team',    required: true,  type: string }
      requester:          { description: 'Requester email', required: true, type: string }
      template_version:   { description: 'Template version', required: true, type: string }
      node_run_id:        { description: 'Port workflow node run id', required: true, type: string }
      subnet_id:          { description: 'Subnet ID',      required: false, type: string, default: '' }
      security_group_ids: { description: 'Security group IDs (comma-separated or JSON array)', required: false, type: string, default: '' }
      key_name:           { description: 'Key pair name',  required: false, type: string, default: '' }

permissions:
  contents: read

jobs:
  create-ec2-instance:
    runs-on: ubuntu-latest
    env:
      # EU: https://api.port.io — US: https://api.us.port.io (optional repo variable PORT_API_BASE)
      PORT_API_BASE: ${{ vars.PORT_API_BASE || 'https://api.port.io' }}
      INSTANCE_NAME: ${{ inputs.instance_name }}
      INSTANCE_TYPE: ${{ inputs.instance_type }}
      AMI_ID: ${{ inputs.ami_id }}
      AWS_REGION_INPUT: ${{ inputs.region }}
      ENVIRONMENT: ${{ inputs.environment }}
      OWNER: ${{ inputs.owner }}
      REQUESTER: ${{ inputs.requester }}
      TEMPLATE_VERSION: ${{ inputs.template_version }}
      NODE_RUN_ID: ${{ inputs.node_run_id }}
      SUBNET_ID: ${{ inputs.subnet_id }}
      SECURITY_GROUP_IDS: ${{ inputs.security_group_ids }}
      KEY_NAME: ${{ inputs.key_name }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$INSTANCE_NAME" =~ ^[a-z][a-z0-9-]{2,30}$ ]] || { echo "Invalid instance name"; exit 1; }
          [[ "$AMI_ID" =~ ^ami-[0-9a-f]{8,17}$ ]]          || { echo "Invalid AMI id"; exit 1; }
          [[ "$INSTANCE_TYPE" =~ ^t3\.(micro|small|medium)$ ]] || { echo "Instance type not permitted"; exit 1; }
          # Port team titles (e.g. "Backend Team") — use grep; bash [[ =~ ]] char classes are brittle
          [ "${#OWNER}" -ge 1 ] && [ "${#OWNER}" -le 64 ] || { echo "Invalid owner"; exit 1; }
          printf '%s' "$OWNER" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_ -]*$' || { echo "Invalid owner"; exit 1; }
          [[ "$REQUESTER" =~ ^[A-Za-z0-9_.@+-]+$ ]]        || { echo "Invalid requester"; exit 1; }
          # Port enums include "Testing"
          [[ "$ENVIRONMENT" =~ ^[A-Za-z]+$ ]]              || { echo "Invalid environment"; exit 1; }

      - name: Get Port token and log helper
        id: port
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PORT_CLIENT_ID}" ] || [ -z "${PORT_CLIENT_SECRET}" ]; then
            echo "::error::PORT_CLIENT_ID / PORT_CLIENT_SECRET are empty — set org credentials from Port → Credentials → Organization"
            exit 1
          fi
          AUTH_BODY=$(jq -n --arg i "$PORT_CLIENT_ID" --arg s "$PORT_CLIENT_SECRET" '{clientId:$i,clientSecret:$s}')
          AUTH_HTTP=$(curl -sS -o /tmp/port-auth.json -w '%{http_code}' -X POST \
            "${PORT_API_BASE}/v1/auth/access_token" \
            -H 'Content-Type: application/json' -d "$AUTH_BODY")
          if [ "$AUTH_HTTP" != "200" ]; then
            echo "::error::Port auth HTTP ${AUTH_HTTP} at ${PORT_API_BASE} — fix Deployments secrets (Osaka org CLIENT_ID/SECRET) or set PORT_API_BASE repo variable"
            cat /tmp/port-auth.json || true
            exit 1
          fi
          TOKEN=$(jq -er '.accessToken' /tmp/port-auth.json)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          cat > /tmp/portlog.sh <<EOF
          # usage: portlog LEVEL "message"   (needs PORT_TOKEN and NODE_RUN_ID in env)
          portlog() {
            curl -sf -X POST "${PORT_API_BASE}/v1/workflows/nodes/runs/\${NODE_RUN_ID}/logs" \
              -H "Authorization: Bearer \${PORT_TOKEN}" -H 'Content-Type: application/json' \
              -d "\$(jq -n --arg l "\$1" --arg m "\$2" '{logs:[{level:\$l,message:\$m}]}')" >/dev/null || true
          }
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Launch instance
        id: create
        env:
          PORT_TOKEN: ${{ steps.port.outputs.token }}
        run: |
          set -euo pipefail
          source /tmp/portlog.sh
          portlog INFO "Launching $INSTANCE_TYPE in $AWS_REGION_INPUT (template $TEMPLATE_VERSION)"

          args=(ec2 run-instances --count 1 --region "$AWS_REGION_INPUT"
                --image-id "$AMI_ID" --instance-type "$INSTANCE_TYPE"
                --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$INSTANCE_NAME},{Key=Owner,Value=$OWNER},{Key=Requester,Value=$REQUESTER},{Key=Environment,Value=$ENVIRONMENT},{Key=TemplateVersion,Value=$TEMPLATE_VERSION},{Key=ManagedBy,Value=port}]")

          if [ -n "$SUBNET_ID" ]; then args+=(--subnet-id "$SUBNET_ID"); fi
          if [ -n "$KEY_NAME" ]; then args+=(--key-name "$KEY_NAME"); fi
          if [ -n "$SECURITY_GROUP_IDS" ]; then
            read -r -a sgs <<< "$(echo "$SECURITY_GROUP_IDS" | tr -d '[]"' | tr ',' ' ')"
            args+=(--security-group-ids "${sgs[@]}")
          fi

          RESULT=$(aws "${args[@]}")
          echo "instance_id=$(echo "$RESULT" | jq -r '.Instances[0].InstanceId')" >> "$GITHUB_OUTPUT"
          portlog INFO "Instance created, waiting for running state"

      - name: Wait until running
        run: |
          aws ec2 wait instance-running --region "$AWS_REGION_INPUT" \
            --instance-ids "${{ steps.create.outputs.instance_id }}"

      - name: Describe instance
        id: describe
        run: |
          set -euo pipefail
          D=$(aws ec2 describe-instances --region "$AWS_REGION_INPUT" \
                --instance-ids "${{ steps.create.outputs.instance_id }}" \
                --query 'Reservations[0].Instances[0]')
          {
            echo "private_ip=$(echo "$D" | jq -r '.PrivateIpAddress // ""')"
            echo "public_ip=$(echo "$D"  | jq -r '.PublicIpAddress // ""')"
            echo "az=$(echo "$D"         | jq -r '.Placement.AvailabilityZone')"
            echo "launch_time=$(echo "$D"| jq -r '.LaunchTime')"
            echo "state=$(echo "$D"      | jq -r '.State.Name')"
          } >> "$GITHUB_OUTPUT"

      - name: Report output to Port node run
        env:
          PORT_TOKEN: ${{ steps.port.outputs.token }}
        run: |
          set -euo pipefail
          source /tmp/portlog.sh
          ID="${{ steps.create.outputs.instance_id }}"
          BODY=$(jq -n \
            --arg instanceId "$ID" \
            --arg instanceType "$INSTANCE_TYPE" \
            --arg privateIp "${{ steps.describe.outputs.private_ip }}" \
            --arg publicIp "${{ steps.describe.outputs.public_ip }}" \
            --arg availabilityZone "${{ steps.describe.outputs.az }}" \
            --arg launchTime "${{ steps.describe.outputs.launch_time }}" \
            --arg state "${{ steps.describe.outputs.state }}" \
            --arg region "$AWS_REGION_INPUT" \
            --arg amiId "$AMI_ID" \
            --arg templateVersion "$TEMPLATE_VERSION" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg consoleUrl "https://$AWS_REGION_INPUT.console.aws.amazon.com/ec2/home?region=$AWS_REGION_INPUT#InstanceDetails:instanceId=$ID" \
            '{output:{instanceId:$instanceId,instanceType:$instanceType,privateIp:$privateIp,publicIp:$publicIp,availabilityZone:$availabilityZone,launchTime:$launchTime,state:$state,region:$region,amiId:$amiId,templateVersion:$templateVersion,runUrl:$runUrl,consoleUrl:$consoleUrl},links:[$consoleUrl]}')
          curl -sf -X PATCH "${PORT_API_BASE}/v1/workflows/nodes/runs/${NODE_RUN_ID}" \
            -H "Authorization: Bearer ${PORT_TOKEN}" -H 'Content-Type: application/json' -d "$BODY"
          portlog INFO "Provisioned $ID. Output reported to Port."

      # Failures: close the Port *workflow node run* (wfnr_*), not the legacy action run (PATCH_RUN).
      # reportWorkflowStatus also closes the node via Ocean/GitHub webhooks, but often after minutes.
      - name: Report failure to Port node run
        if: failure() && inputs.node_run_id != ''
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          NODE_RUN_ID: ${{ inputs.node_run_id }}
        run: |
          set -u
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "${PORT_CLIENT_ID:-}" ] || [ -z "${PORT_CLIENT_SECRET:-}" ]; then
            echo "Port secrets missing — relying on reportWorkflowStatus"
            exit 0
          fi
          AUTH_HTTP=$(curl -sS -o /tmp/port-auth-fail.json -w '%{http_code}' -X POST \
            "${PORT_API_BASE}/v1/auth/access_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg i "$PORT_CLIENT_ID" --arg s "$PORT_CLIENT_SECRET" '{clientId:$i,clientSecret:$s}')")
          if [ "$AUTH_HTTP" != "200" ]; then
            echo "Port auth HTTP ${AUTH_HTTP} at ${PORT_API_BASE} — cannot PATCH node run"
            cat /tmp/port-auth-fail.json || true
            exit 0
          fi
          TOKEN=$(jq -r '.accessToken' /tmp/port-auth-fail.json)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Port auth response missing accessToken"
            exit 0
          fi
          curl -sS -X POST "${PORT_API_BASE}/v1/workflows/nodes/runs/${NODE_RUN_ID}/logs" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg url "$RUN_URL" '{logs:[{level:"ERROR",message:("GitHub workflow failed — " + $url)}]}')" \
            || echo "Port log POST failed (non-fatal)"
          HTTP=$(curl -sS -o /tmp/port-patch-body.txt -w '%{http_code}' -X PATCH \
            "${PORT_API_BASE}/v1/workflows/nodes/runs/${NODE_RUN_ID}" \
            -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg url "$RUN_URL" '{status:"COMPLETED",result:"FAILED",links:[$url]}')")
          echo "Port node run PATCH HTTP $HTTP"
          cat /tmp/port-patch-body.txt || true
          # Do not fail the job again if Port rejects while Ocean still owns the node (409/422).
          [[ "$HTTP" == "200" || "$HTTP" == "204" ]] || echo "Port status will rely on reportWorkflowStatus"
